<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b97446">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mers">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Les Mers de l'Ascension</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Mobile d'abord. Chaque téléphone est un plateau personnel : en-tête (ordre du tour, scores),
   onglets Navire / Marché / Équipage / Journal, panneau d'action toujours visible en bas. Thème unique, clair. */
:root{
  --table:#b97446; --table-dark:#8a4f2c; --paper:#fdf1d6; --paper-2:#f4e0b5; --paper-3:#ead09a;
  --ink:#3b2314; --ink-soft:#7a5638; --frame:#2f2342; --frame-2:#43325e; --frame-text:#d9cdef;
  --coin:#f7a928; --gold:#f5b324; --gold-dark:#b97a10; --white:#ffffff;
  --go:#4cc26a; --go-dark:#2c8a45; --sky:#3f9be8; --sky-dark:#2468a8; --alert:#e2513f;
  --v-ing:#ec8436; --v-fla:#e9473c; --v-rec:#1fae82; --v-lum:#efb81d; --v-aby:#8457ea; --v-cou:#3597ea; --v-sta:#8592a0;
  --f-display:'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --f-body:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  color-scheme:light;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; min-height:100%}
body{
  background:repeating-linear-gradient(90deg, rgba(0,0,0,.035) 0 2px, transparent 2px 46px), radial-gradient(ellipse 120% 80% at 50% 0%, #c98454 0%, var(--table) 55%, var(--table-dark) 100%) fixed, var(--table);
  color:var(--ink); font-family:var(--f-body); font-weight:700; font-size:15px; line-height:1.35;
  padding-left:max(12px, env(safe-area-inset-left, 0px)); padding-right:max(12px, env(safe-area-inset-right, 0px));
  padding-top:calc(var(--safe-t) + 10px);
}
body.ingame{padding-bottom:calc(var(--safe-b) + 250px)}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display); font-weight:400; margin:0; letter-spacing:.3px; text-wrap:balance}
.wrap{max-width:900px; margin:0 auto; display:grid; gap:14px}
.paper{background:var(--paper); border:3px solid var(--ink); border-radius:18px; box-shadow:0 5px 0 var(--table-dark); padding:12px 14px; min-width:0}
.label{font-size:10.5px; text-transform:uppercase; letter-spacing:1.3px; color:var(--ink-soft); font-weight:900}
.note{font-size:13px; color:var(--ink-soft)}
.btn{font-family:var(--f-display); font-size:16px; letter-spacing:.3px; color:var(--ink); background:var(--paper-2); border:3px solid var(--ink); border-radius:13px; box-shadow:0 4px 0 var(--ink); padding:9px 14px 8px; cursor:pointer; line-height:1.15; transition:transform .06s, box-shadow .06s; touch-action:manipulation}
.btn:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
.btn.go{background:var(--go); color:var(--white); text-shadow:0 2px 0 var(--go-dark)}
.btn.sky{background:var(--sky); color:var(--white); text-shadow:0 2px 0 var(--sky-dark)}
.btn.gold{background:var(--gold)}
.btn.small{font-size:13.5px; padding:6px 10px 5px; border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.42; cursor:not-allowed; box-shadow:0 2px 0 var(--ink)}
.btn:focus-visible, .seg input:focus-visible + label, input:focus-visible{outline:3px solid var(--sky); outline-offset:2px}
.seg{display:inline-flex; border:3px solid var(--ink); border-radius:12px; overflow:hidden; box-shadow:0 3px 0 var(--ink); background:var(--paper-2)}
.seg input{position:absolute; opacity:0; pointer-events:none}
.seg label{padding:6px 12px 5px; font-family:var(--f-display); font-size:15px; cursor:pointer; border-left:2px solid var(--ink)}
.seg label:first-of-type{border-left:0}
.seg input:checked + label{background:var(--sky); color:var(--white)}
.field{display:grid; gap:6px}
.field input{font:inherit; font-weight:800; font-size:17px; padding:10px 12px; border:3px solid var(--ink); border-radius:12px; background:var(--white); color:var(--ink); width:100%}
.stack{display:grid; gap:12px}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}

/* Accueil */
.hero{display:grid; justify-items:center; gap:8px; text-align:center; padding:8px 0 2px}
.hero svg{width:84px; height:84px}
.hero h1{font-size:34px; line-height:.95; color:var(--paper); text-shadow:0 3px 0 var(--ink), 0 0 1px var(--ink); -webkit-text-stroke:1.5px var(--ink)}
.hero p{margin:0; color:var(--paper); font-weight:800}
.ribbon-h{display:inline-block; background:var(--sky); color:var(--white); border:3px solid var(--ink); border-radius:10px; padding:3px 14px 2px; text-shadow:0 2px 0 var(--sky-dark); box-shadow:0 3px 0 var(--ink); font-size:22px}
.steps{margin:0; padding-left:20px; display:grid; gap:6px; font-size:14px; font-weight:700}

/* Salon */
.seats{display:grid; gap:8px}
.seat{display:flex; align-items:center; gap:10px; padding:8px 10px; background:var(--paper-2); border:2px solid var(--ink); border-radius:12px}
.seat .nmx{flex:1; min-width:0; overflow-wrap:anywhere}
.tag{font-size:11px; font-weight:900; border:2px solid var(--ink); border-radius:8px; padding:1px 6px; background:var(--paper); white-space:nowrap}
.tag.warn{background:#ffd9d2; color:#8f2214}
.tag.ok{background:#d7f3dc}
.av{position:relative; width:34px; height:34px; border-radius:50%; border:3px solid var(--ink); display:grid; place-items:center; color:var(--white); font-family:var(--f-display); font-size:16px; background:var(--pc); flex:none}

/* Appairage */
.overlay{position:fixed; inset:0; background:rgba(40,22,10,.55); display:grid; place-items:center; padding:16px; padding-top:calc(var(--safe-t) + 16px); z-index:50; overflow:auto}
.modal{width:min(440px, 100%); display:grid; gap:12px; justify-items:center; text-align:center}
.code{display:flex; gap:8px; justify-content:center}
.code b{width:58px; height:68px; display:grid; place-items:center; font-family:var(--f-display); font-weight:400; font-size:40px; background:var(--white); border:3px solid var(--ink); border-radius:12px; box-shadow:0 4px 0 var(--ink)}
.codein{display:block; width:100%; min-width:0; box-sizing:border-box; font-family:var(--f-display); font-weight:400; font-size:38px; letter-spacing:14px; text-align:center; text-transform:uppercase; padding:8px 0 6px 14px; border:3px solid var(--ink); border-radius:12px; background:var(--white); color:var(--ink)}
.err{color:#9a2414; font-weight:800; margin:0}

/* En jeu : en-tête */
.hdr{position:sticky; top:calc(var(--safe-t) + 6px); z-index:20; display:grid; gap:8px; padding:8px 10px}
.hdr .top{display:flex; align-items:center; gap:8px}
.hdr .top h2{font-size:18px; flex:1; min-width:0}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chipinfo{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border:2px solid var(--ink); border-radius:999px; background:var(--paper-2); font-size:12px}
.chipinfo.ok{background:#d7f3dc}
.chipinfo.no{background:var(--paper-3); color:var(--ink-soft)}
.crew{display:flex; gap:6px; overflow-x:auto; padding:6px 2px 2px; scrollbar-width:none}
.crew::-webkit-scrollbar{display:none}
.mate{flex:1 0 62px; min-width:62px; display:grid; justify-items:center; gap:2px; padding:4px 3px 3px; border-radius:12px; border:2px solid transparent; position:relative}
.mate.on{border-color:var(--ink); background:#fff3cf; box-shadow:0 0 0 2px var(--gold)}
.mate.me .mn::after{content:" (vous)"; font-weight:700; color:var(--ink-soft)}
.mate .mn{font-size:11px; font-weight:900; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mate .ms{font-size:11.5px; font-variant-numeric:tabular-nums; white-space:nowrap}
.mate .first{position:absolute; top:-6px; left:50%; transform:translateX(-50%); font-size:9px; background:var(--gold); border:2px solid var(--ink); border-radius:6px; padding:0 4px; font-weight:900; line-height:1.2}
.mate.done{opacity:.55}
.mate .sk{position:absolute; top:-4px; right:2px; font-size:11px}

/* Onglets */
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30; display:grid; grid-template-columns:repeat(4,1fr); gap:4px; padding:6px max(10px, env(safe-area-inset-left,0px)) calc(var(--safe-b) + 6px) max(10px, env(safe-area-inset-right,0px)); background:var(--table-dark); border-top:3px solid var(--ink)}
.tab{position:relative; display:grid; justify-items:center; gap:1px; font-family:var(--f-display); font-size:13px; color:var(--paper); background:transparent; border:0; padding:4px 0 2px; cursor:pointer}
.tab .ti{width:40px; height:40px; border-radius:50%; border:3px solid var(--ink); background:var(--paper-2); display:grid; place-items:center; font-size:19px; box-shadow:0 3px 0 var(--ink)}
.tab.on .ti{background:var(--gold); transform:translateY(-3px)}
.tab .dot{position:absolute; top:2px; right:calc(50% - 26px); width:14px; height:14px; border-radius:50%; background:var(--alert); border:2px solid var(--ink)}
.sheet{position:fixed; left:0; right:0; bottom:calc(var(--safe-b) + 74px); z-index:25; padding:0 max(10px, env(safe-area-inset-left,0px)) 6px max(10px, env(safe-area-inset-right,0px)); pointer-events:none}
.sheet .paper{pointer-events:auto; max-width:900px; margin:0 auto; max-height:44vh; overflow-y:auto; padding:10px 12px; display:grid; gap:8px; box-shadow:0 -2px 0 rgba(0,0,0,.08), 0 5px 0 var(--table-dark)}
.sheet .paper.mine{box-shadow:0 0 0 4px var(--gold), 0 5px 0 var(--table-dark)}
.sheet h3{font-size:19px}
.sheet p{margin:0}
.tray{display:flex; align-items:center; gap:8px}
.die{width:40px; height:40px; background:var(--white); border:3px solid var(--ink); border-radius:11px; box-shadow:0 3px 0 var(--ink); display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr); padding:5px; flex:none}
.die i{width:7px; height:7px; border-radius:50%; background:var(--ink); place-self:center; visibility:hidden}
.die i.on{visibility:visible}
.die.spin{animation:spin .4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sum{width:40px; height:40px; border-radius:50%; background:var(--coin); border:3px solid var(--ink); display:grid; place-items:center; font-family:var(--f-display); font-size:20px; flex:none}
.tray .ex{font-size:12px; color:var(--ink-soft); flex:1; min-width:0}
.opts{display:flex; flex-wrap:wrap; gap:8px}
.opts.grid{display:grid; grid-template-columns:repeat(6,1fr)}
.opts.col{display:grid}
.opts.col .btn{text-align:left; font-family:var(--f-body); font-weight:800; font-size:13.5px}
.opts .btn{flex:1 1 auto}
.wait{display:flex; align-items:center; gap:10px; margin:0; font-weight:800}

/* Contenu des onglets */
.head{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px 12px; margin-bottom:10px}
.stats{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px}
.st{display:grid; gap:2px}
.st .label{font-size:9.5px; letter-spacing:.6px}
.st .v{display:flex; align-items:center; gap:5px; font-family:var(--f-display); font-size:19px; font-variant-numeric:tabular-nums}
.ico{width:22px; height:22px; border-radius:6px; border:2px solid var(--ink); display:grid; place-items:center; font-size:12px; flex:none; background:var(--ic)}
.prog{position:relative; height:22px; border:3px solid var(--ink); border-radius:999px; background:var(--paper-3); overflow:hidden; margin-top:8px}
.prog i{position:absolute; inset:0 auto 0 0; background:linear-gradient(var(--gold), #e39a12); border-right:2px solid var(--ink); transition:width .4s}
.prog span{position:relative; display:block; text-align:center; font-family:var(--f-display); font-size:14px; line-height:16px}
.album{display:grid; grid-template-columns:repeat(11, minmax(0,1fr)); gap:3px; margin-top:6px}
.tile{position:relative; text-align:center; padding:4px 0 3px; border-radius:8px; border:2px dashed var(--ink-soft); color:var(--ink-soft)}
.tile b{display:block; font-family:var(--f-display); font-weight:400; font-size:16px; line-height:1}
.tile small{font-size:8px; font-variant-numeric:tabular-nums}
.tile.on{border:2px solid var(--ink); background:var(--gold); color:var(--ink)}
.tile.used{background:var(--paper-3); border-style:solid; color:var(--ink-soft); text-decoration:line-through}
.cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(148px, 1fr)); gap:18px 14px; padding:8px 4px 4px 10px}
.slot{display:grid; gap:9px}
.slot .btn{font-size:14px; padding:7px 8px 6px}
.card{position:relative; background:var(--frame); border:3px solid var(--frame); border-radius:15px; color:var(--white); box-shadow:0 0 0 2px var(--ink), 0 5px 0 rgba(0,0,0,.3); display:flex; flex-direction:column; gap:5px; padding:5px; margin-top:6px}
.card .art{position:relative; height:80px; border-radius:10px; overflow:hidden; background:radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--vc) 45%, var(--white)) 0%, var(--vc) 75%)}
.card .art svg{position:absolute; inset:0; width:100%; height:100%}
.card .nm{position:absolute; top:5px; right:5px; left:30px; background:color-mix(in srgb, var(--vc) 78%, var(--frame)); border:2px solid var(--frame); border-radius:7px; padding:2px 6px 1px; font-family:var(--f-display); font-size:13.5px; line-height:1.1; text-align:right; text-shadow:0 1px 0 rgba(0,0,0,.45); z-index:1}
.card .cost{position:absolute; top:-10px; left:-10px; width:34px; height:34px; border-radius:50%; background:var(--coin); border:3px solid var(--frame); box-shadow:0 0 0 2px var(--ink); color:var(--ink); display:grid; place-items:center; font-family:var(--f-display); font-size:18px; z-index:2}
.card .cost.free{background:var(--go); color:var(--white)}
.card .cost.base{background:var(--paper-3); font-size:14px}
.card .hex{position:absolute; left:-11px; top:52px; width:34px; height:38px; clip-path:polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background:var(--ink); display:grid; place-items:center; z-index:2}
.card .hex b{width:27px; height:31px; clip-path:inherit; background:var(--paper); color:var(--ink); display:grid; place-items:center; font-family:var(--f-display); font-weight:400; font-size:17px}
.card .badges{position:absolute; left:8px; right:6px; bottom:5px; display:flex; flex-wrap:wrap; gap:4px; justify-content:flex-end; z-index:1}
.card .bd{font-size:9.5px; font-weight:900; text-transform:uppercase; padding:1px 6px; border-radius:999px; border:2px solid var(--frame); background:var(--white); color:var(--ink)}
.card .bd.share{background:var(--v-rec); color:var(--white)}
.card .bd.free{background:var(--go); color:var(--white)}
.card .eff{background:var(--frame-2); border-radius:9px; padding:7px 8px; font-size:12.5px; line-height:1.3; min-height:60px; flex:1; margin:0}
.card .foot{display:flex; justify-content:space-between; gap:6px; font-size:10.5px; font-weight:800; color:var(--frame-text); padding:0 4px 1px}
.card.prem{background:linear-gradient(#ffd35a, var(--gold-dark)); border-color:var(--gold)}
.card.prem .eff{background:var(--frame)}
.card.prem .foot{color:var(--ink)}
.card .stars{position:absolute; top:-14px; left:0; right:0; text-align:center; font-size:16px; color:var(--gold); -webkit-text-stroke:1.5px var(--ink); z-index:3; pointer-events:none}
.card.lit{box-shadow:0 0 0 2px var(--ink), 0 0 0 6px var(--go), 0 0 22px rgba(76,194,106,.8)}
.opp{display:grid; gap:8px}
.who{display:flex; align-items:center; gap:10px}
.who h3{font-size:19px; flex:1; min-width:0; overflow-wrap:anywhere}
.minis{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:5px}
.mini{display:grid; grid-template-columns:28px minmax(0,1fr); gap:0 8px; align-items:center; background:var(--paper-2); border:2px solid var(--ink); border-radius:10px; padding:3px 7px 3px 3px}
.mini.lit{background:#d4f5db; box-shadow:0 0 0 3px var(--go)}
.mini.prem{background:#fde8b0}
.hexs{width:26px; height:28px; clip-path:polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background:var(--ink); display:grid; place-items:center; grid-row:span 2}
.hexs b{width:20px; height:22px; clip-path:inherit; background:var(--vc); color:var(--white); display:grid; place-items:center; font-family:var(--f-display); font-weight:400; font-size:13px}
.mini .mn2{font-weight:900; font-size:12.5px}
.mini .mt{font-size:11.5px; color:var(--ink-soft); line-height:1.25}
.pill{display:inline-block; font-size:9.5px; font-weight:900; text-transform:uppercase; padding:1px 6px; border-radius:999px; background:var(--v-rec); color:var(--white); margin-left:4px; vertical-align:1px}
.log{display:grid; gap:4px; font-size:13.5px}
.log .turn{margin-top:7px; padding-top:7px; border-top:2px dashed var(--paper-3); font-family:var(--f-display); font-weight:400; font-size:15px}
.log .round{margin-top:8px; padding:4px 8px; border-radius:8px; background:var(--paper-2); border:2px solid var(--ink); font-family:var(--f-display); font-weight:400}
.log .sys{color:var(--ink-soft); font-style:italic}
.log .win{font-family:var(--f-display); font-weight:400; font-size:17px; color:var(--gold-dark)}
.rank{display:grid; gap:6px; margin:4px 0; padding:0; list-style:none}
.rank li{display:flex; align-items:center; gap:8px; padding:5px 8px 5px 5px; background:var(--paper-2); border:2px solid var(--ink); border-radius:10px; font-size:13px}
.rank .rk{font-family:var(--f-display); font-size:17px; width:18px; text-align:center}
.rank .grow{flex:1; min-width:0}
.rules p{margin:0 0 8px; font-size:14px}
.rules b{font-family:var(--f-display); font-weight:400; font-size:15px}
@media (min-width:700px){ .opts.grid{grid-template-columns:repeat(12,1fr)} .album{gap:6px} .tile small{font-size:10px} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<div class="sheet" id="sheet" hidden></div>
<nav class="tabbar" id="tabbar" hidden aria-label="Onglets"></nav>
<div class="overlay" id="overlay" hidden></div>

    if (!p.cards.includes(c)) continue;
    log(`${nm(p)} active ${c.n}.`);
    await applyCard(p, c, ctx, 0);
    sync(); await pause(.5);
  }
}
async function applyCard(p, c, ctx, depth){
  G.lit.add(c.uid); sync();
  for (const op of c.ops){ await doOp(p, c, op, ctx, depth); sync(); }
}
async function pickOpp(p, title, text, mode){
  if (!p.human) return mode === 'richest' ? richest(p) : leader(p);
  return askP(p, {title, text, options: others(p).map(o => ({label:`${o.name} · ${o.coins}🪙 · ${o.crowns}👑`, value:o}))});
}
async function payOrPass(payer, recv, x){
  if (payer.coins < x){ payer.skip = true; log(`${nm(payer)} n'a pas ${x}🪙 : il passera son prochain tour.`); return; }
  const pay = payer.human
    ? await askP(payer, {title:`${recv.name} vous met la pression`, text:`Payez ${x}🪙 à ${recv.name}, ou passez votre prochain tour : aucune de vos cartes ne s'activera.`, options:[{label:`Payer ${x}🪙`, value:true, cls:'go'},{label:'Passer mon prochain tour', value:false}]})
    : true;
  if (pay) transfer(payer, recv, x);
  else { payer.skip = true; log(`${nm(payer)} refuse de payer et passera son prochain tour.`); }
}
async function doOp(p, c, op, ctx, depth){
  const [t, a1, a2] = op;
  switch (t){
    case 'c': gainC(p, a1); break;
    case 'k': gainK(p, a1); break;
    case 'conv':
      for (let i = 0; i < a2; i++){
        if (p.coins < a1){ log(`${nm(p)} n'a pas ${a1}🪙 à convertir.`); break; }
        if (p.human && !(await askP(p, {title:c.n, text:`Convertir ${a1}🪙 en 1👑 ?${a2 > 1 ? ` (conversion ${i + 1} sur ${a2})` : ''}`, options:[{label:`Convertir ${a1}🪙 → 1👑`, value:true, cls:'go'},{label:'Garder mes pièces', value:false}]}))){ log(`${nm(p)} garde ses pièces.`); break; }
        p.coins -= a1; log(`${nm(p)} convertit ${a1}🪙.`); gainK(p, 1);
      }
      break;
    case 'ifle5k': if (p.coins <= 5) gainK(p, a1); else log(`Condition non remplie : ${nm(p)} a plus de 5🪙.`); break;
    case 'ifle5c': if (p.coins <= 5) gainC(p, a1); else log(`Condition non remplie : ${nm(p)} a plus de 5🪙.`); break;
    case 'ifge9k': if (p.coins >= 9) gainK(p, a1); else log(`Condition non remplie : ${nm(p)} a moins de 9🪙.`); break;
    case 'recifs':
      if (p.cards.filter(x => x.v === 'Récifs').length >= 3) gainK(p, 1);
      else log(`Condition non remplie : ${nm(p)} a moins de 3 cartes Récifs.`);
      break;
    case 'pay_me': { const o = await pickOpp(p, c.n, `Ciblez un adversaire : il vous paie ${a1}🪙 ou passe son tour.`, 'leader'); await payOrPass(o, p, a1); break; }
    case 'all_pay': for (const o of others(p)) transfer(o, p, a1); break;
    case 'all_rich':
      for (const o of others(p)){ if (o.coins >= a2) transfer(o, p, a1); else log(`${nm(o)} a moins de ${a2}🪙 et ne paie rien.`); }
      break;
    case 'all_pass': for (const o of others(p)) await payOrPass(o, p, a1); break;
    case 'tc': { const o = await pickOpp(p, c.n, `Prenez ${a1}🪙 à un adversaire.`, 'richest'); transfer(o, p, a1); break; }
    case 'tcb': { const o = await pickOpp(p, c.n, `Prenez ${a1}🪙 à un adversaire, ${a2}🪙 de plus s'il a plus de 👑 que vous.`, 'leader'); transfer(o, p, a1 + (o.crowns > p.crowns ? a2 : 0)); break; }
    case 'tc_rich': transfer(richest(p), p, a1); break;
    case 'half_all': for (const o of others(p)) transfer(o, p, Math.floor(o.coins / 2)); break;
    case 'copy_own': case 'copy_adv': {
      if (depth > 0) break;
      const pool = (t === 'copy_own' ? p.cards.map(x => [x, p]) : others(p).flatMap(o => o.cards.map(x => [x, o])))
        .filter(([x]) => !isCopy(x) && !isDice(x) && !x.p && Math.abs(x.d - c.d) === 1);
      if (!pool.length){ log(`${nm(p)} n'a aucune carte à copier.`); break; }
      const pick = p.human
        ? await askP(p, {title:c.n, text: t === 'copy_own' ? 'Choisissez une de vos cartes à copier.' : 'Choisissez une carte adverse à copier.', col:true,
            options: pool.map(([x, o]) => ({label:`${x.d} · ${x.n}${o === p ? '' : ' (' + o.name + ')'} — ${x.e}`, value:[x, o]}))})
        : pool.sort((A, B) => B[0].V - A[0].V)[0];
      const [x] = pick;
      log(`${nm(p)} copie ${x.n}.`);
      G.lit.add(x.uid);
      for (const op2 of x.ops) await doOp(p, x, op2, ctx, 1);
      break;
    }
    case 'reroll1': case 'reroll2': case 'choose': case 'adj':
      if (depth === 0) await diceOp(p, c, op, ctx);
      break;
  }
}
async function diceOp(p, c, op, ctx){
  const [a, b] = ctx.dice, s = a + b;
  const gain = v => ctx.used.has(v) ? 0 : p.cards.filter(x => x.d === v).reduce((t, x) => t + x.V, 0);
  const usedTxt = `Valeurs déjà épuisées : ${[...ctx.used].sort((x,y)=>x-y).join(', ')}.`;
  const split = v => { const x = Math.min(6, v - 1); return [x, v - x]; };
  let nd = null, random = false;
  if (op[0] === 'reroll1'){
    if (p.human){
      const ch = await askP(p, {title:c.n, text:`Relancez un dé de votre choix. ${usedTxt}`, options:[{label:`Relancer le dé ${a}`, value:0, cls:'go'},{label:`Relancer le dé ${b}`, value:1, cls:'go'},{label:'Ne pas relancer', value:-1}]});
      if (ch < 0) return;
      nd = ch === 0 ? [d6(), b] : [a, d6()];
    } else {
      const e = i => { let t = 0; for (let k = 1; k <= 6; k++) t += gain((i === 0 ? b : a) + k); return t; };
      const i = e(0) >= e(1) ? 0 : 1;
      if (e(i) === 0){ log(`${nm(p)} ne relance pas.`); return; }
      nd = i === 0 ? [d6(), b] : [a, d6()];
    }
    random = true;
  } else if (op[0] === 'reroll2'){
    if (p.human){
      const ch = await askP(p, {title:c.n, text:`Relancez les deux dés. ${usedTxt}`, options:[{label:'Relancer les 2 dés', value:true, cls:'go'},{label:'Ne pas relancer', value:false}]});
      if (!ch) return;
    }
    nd = [d6(), d6()]; random = true;
  } else if (op[0] === 'choose'){
    let v;
    if (p.human){
      v = await askP(p, {title:c.n, text:`Choisissez le nouveau résultat des dés. En vert : les valeurs où vous avez une carte. ${usedTxt}`, grid:true,
        options:[...Array(11)].map((_, i) => i + 2).map(x => ({label:String(x), value:x, disabled:ctx.used.has(x), cls:gain(x) > 0 ? 'go' : ''})).concat([{label:'Garder', value:0}])});
      if (!v) return;
    } else {
      v = [...Array(11)].map((_, i) => i + 2).sort((x, y) => gain(y) - gain(x))[0];
      if (!gain(v)){ log(`${nm(p)} garde son résultat.`); return; }
    }
    nd = split(v);
  } else if (op[0] === 'adj'){
    const N = op[1];
    const cand = [s - N, s + N].filter(v => v >= 2 && v <= 12 && !ctx.used.has(v));
    if (!cand.length){ log(`${c.n} : aucun total possible à ±${N}.`); return; }
    let v;
    if (p.human){
      v = await askP(p, {title:c.n, text:`Ajoutez ou retirez ${N} au total de ${s}. ${usedTxt}`, options: cand.map(x => ({label:`Passer à ${x}`, value:x, cls:gain(x) > 0 ? 'go' : ''})).concat([{label:'Ne rien changer', value:0}])});
      if (!v) return;
    } else {
      v = cand.sort((x, y) => gain(y) - gain(x))[0];
      if (!gain(v)){ log(`${nm(p)} ne change pas le total.`); return; }
    }
    nd = split(v);
  }
  if (!nd) return;
  await rollAnim(nd, random);
  ctx.dice = nd;
  log(`${nm(p)} : nouveau total ${nd[0] + nd[1]}.`);
  await resolveValue(p, nd[0] + nd[1], ctx);
}
const isFree = i => i === 0 && G.freeAvail;
const priceAt = i => isFree(i) ? 0 : G.market[i].c;
function worth(p, c){
  const same = p.cards.filter(x => x.p === c.p), lim = c.p ? 1 : p.slots;
  return ev(c) - (same.length >= lim ? Math.min(...same.map(ev)) : 0);
}
function refreshMarket(p){
  p.coins -= 2; p.refreshes++; G.refreshed = true;
  G.deck.unshift(...G.market);
  G.market = G.deck.splice(-Math.min(MKT(), G.deck.length));
  log(`${nm(p)} paie 2🪙 et rafraîchit le marché.`);
}
async function take(p, idx){
  const c = G.market[idx], free = isFree(idx), cost = free ? 0 : c.c;
  const same = p.cards.filter(x => x.p === c.p), lim = c.p ? 1 : p.slots;
  if (same.length >= lim){
    let out;
    if (p.human){
      out = await askP(p, {title: c.p ? 'Emplacement premium occupé' : 'Plateau plein', text:`Défaussez une carte pour placer ${c.n}.`, col:true,
        options: same.map(x => ({label:`Défausser ${x.d} · ${x.n} — ${x.e}`, value:x})).concat([{label:'Annuler', value:null}])});
      if (!out) return false;
    } else out = same.sort((A, B) => ev(A) - ev(B))[0];
    if (!G.market.includes(c)) return false;
    p.cards.splice(p.cards.indexOf(out), 1);
    G.deck.unshift(out);
    log(`${nm(p)} défausse ${out.n}, qui part sous la pioche.`);
  }
  const i2 = G.market.indexOf(c);
  p.coins -= cost; p.bought++;
  p.cards.push(c);
  if (free) G.freeAvail = false;
  G.market.splice(i2, 1);
  if (G.deck.length) G.market.splice(i2, 0, G.deck.pop());
  log(free ? `${nm(p)} prend la carte gratuite ${c.n}. Plus de carte gratuite avant le prochain tour de table.` : `${nm(p)} achète ${c.n} pour ${cost}🪙.`);
  return true;
}
async function humanPort(p){
  while (true){
    const opts = [];
    if (!G.refreshed) opts.push({label:'Rafraîchir le marché · 2🪙', value:{t:'refresh'}, disabled:p.coins < 2, cls:'sky'});
    opts.push({label:'Ne rien faire', value:{t:'none'}});
    const ch = await askP(p, {title:'Port', text:`Une seule action : prenez ou achetez une carte dans l'onglet Marché, ou passez.${G.refreshed ? '' : ' Vous pouvez d\'abord rafraîchir le marché.'}`, options:opts, market:true});
    if (ch.t === 'refresh'){ if (p.coins >= 2 && !G.refreshed){ refreshMarket(p); sync(); } continue; }
    if (ch.t === 'none'){ log(`${nm(p)} ne fait rien au port.`); return; }
    if (ch.t === 'buy' && await take(p, ch.idx)) return;
  }
}
function bestBuy(p){
  let best = -1, bw = 0;
  G.market.forEach((c, i) => { const cost = priceAt(i); if (cost > p.coins) return; const w = worth(p, c) - .05 * cost; if (w > bw){ bw = w; best = i; } });
  return [best, bw];
}
async function botPort(p){
  await pause(.6);
  const normals = p.cards.filter(x => !x.p).length;
  let [best, bw] = bestBuy(p);
  const room = normals < p.slots || !p.cards.some(x => x.p);
  if (bw < .2 && room && p.coins >= 4 && G.deck.length){ refreshMarket(p); sync(); await pause(.6); [best, bw] = bestBuy(p); }
  if (best >= 0) await take(p, best); else log(`${nm(p)} ne fait rien au port.`);
}
async function humanConvert(p){
  while (p.coins >= G.o.rate){
    const ch = await askP(p, {title:'Convertir', text:`Échangez ${G.o.rate}🪙 contre 1👑, autant de fois que vous voulez.`,
      options:[{label:`Convertir ${G.o.rate}🪙 → 1👑`, value:1, cls:'go'},{label:'Terminer le tour', value:0}]});
    if (!ch) return;
    p.coins -= G.o.rate; log(`${nm(p)} convertit ${G.o.rate}🪙.`); gainK(p, 1); sync();
  }
}
async function botConvert(p){
  while (p.coins >= G.o.rate){ p.coins -= G.o.rate; log(`${nm(p)} convertit ${G.o.rate}🪙.`); gainK(p, 1); }
}

/* Un joueur distant est parti : un bot prend sa place */
function seatLost(seatObj, why){
  if (LOBBY){
    const i = LOBBY.seats.indexOf(seatObj);
    if (!G && i >= 0){ LOBBY.seats.splice(i, 1); sync(true); return; }
  }
  if (!G) return;
  const p = G.players.find(x => x.seatRef === seatObj);
  if (!p || p.kind !== 'remote') return;
  p.kind = 'bot'; p.human = false; seatObj.kind = 'bot'; seatObj.conn = null;
  log(`${nm(p)} a quitté la partie${why ? ' (' + why + ')' : ''} : un bot prend sa place.`, 'sys');
  if (pending && pending.seat === seatOf(p)){ const pd = pending; pending = null; pd.res(defaultAnswer(pd.spec)); }
  sync(true);
}

/* =====================================================================
   SYNCHRONISATION : l'hôte envoie à chaque téléphone sa vue de la partie
   ===================================================================== */

  const pr = pending && pending.seat === seat ? pending.spec : null;
  return {v:VERSION, phase:'game', me:seat, goal:G.o.goal, rate:G.o.rate, round:G.round, pos:G.pos,
    order:G.order.map(seatOf), active:seatOf(G.active), free:G.freeAvail, deck:G.deck.length, refreshed:G.refreshed,
    market:G.market.map(c => [c.k, c.uid]), dice:G.dice, rolling:G.rolling, used:G.used, lit:[...G.lit],
    log:G.log.slice(-70), winner: G.winner ? seatOf(G.winner) : -1, waiting: pending ? pending.seat : -1,
    players:G.players.map(p => ({n:p.name, kind:p.kind, c:p.coins, k:p.crowns, skip:p.skip, b:p.bought, r:p.refreshes, cards:p.cards.map(c => [c.k, c.uid])})),
    prompt: pr && {id:pr.id, title:pr.title, text:pr.text, grid:!!pr.grid, col:!!pr.col, market:!!pr.market, options:pr.options.map(o => ({l:o.label, d:!!o.disabled, c:o.cls || ''}))}};
}
let syncT = null;
function sync(now){
  if (ROLE !== 'host') return;
  if (now){ clearTimeout(syncT); syncT = null; doSync(); return; }
  if (syncT) return;
  syncT = setTimeout(() => { syncT = null; doSync(); }, 45);
}
function doSync(){
  const seats = G ? G.players.map(p => p.seatRef) : LOBBY.seats;
  seats.forEach((s, i) => {
    if (s.kind === 'remote' && s.conn && s.conn.isOpen()) s.conn.send(JSON.stringify({t:'vm', vm:vmFor(i)}));
  });
  VM = vmFor(MYSEAT);

}
function onLocalAnswer(msg){

  else if (ROLE === 'guest' && HOSTCONN && HOSTCONN.isOpen()){

  }
}

/* ---------- Connexions (PeerJS : mise en relation par un code, puis lien direct entre téléphones) ---------- */
const SIGNAL = () => (window.MERS_SIGNAL || {});          // réglage de test : serveur de mise en relation local
const CODE_ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ';            // sans I ni O pour éviter les confusions
const PEER_PREFIX = 'mers-ascension-v25-';
const newCode = () => [...Array(4)].map(() => CODE_ALPHA[Math.floor(Math.random() * CODE_ALPHA.length)]).join('');
function wrapConn(dc){
  const L = {dc, lastSeen:Date.now(), onmsg:null, onclose:null,
    send(s){ try { if (dc.open) dc.send(s); } catch(e){} },
    isOpen(){ return !!dc.open; },
    close(){ try { dc.close(); } catch(e){} }};
  const lost = () => { if (L.onclose){ const f = L.onclose; L.onclose = null; f(); } };
  dc.on('data', d => { L.lastSeen = Date.now(); if (L.onmsg) L.onmsg(typeof d === 'string' ? d : String(d)); });
  dc.on('close', lost); dc.on('error', lost);
  const watchPC = () => { const pc = dc.peerConnection; if (pc) pc.addEventListener('connectionstatechange', () => { if (pc.connectionState === 'failed' || pc.connectionState === 'closed') lost(); }); };
  if (dc.peerConnection) watchPC(); else dc.on('open', watchPC);
  return L;
}
function openTable(attempt = 0){
  if (HOSTPEER || !LOBBY) return;
  LOBBY.code = null; LOBBY.codeState = 'wait'; LOBBY.codeErr = null; sync(true);
  const code = newCode();
  const peer = new Peer(PEER_PREFIX + code, {...SIGNAL(), debug:0});
  HOSTPEER = peer;
  peer.on('open', () => { if (HOSTPEER !== peer || !LOBBY) return; LOBBY.code = code; LOBBY.codeState = 'ok'; sync(true); });
  peer.on('connection', dc => { if (HOSTPEER === peer) onGuestConn(dc); });
  peer.on('error', err => {
    if (HOSTPEER !== peer || !LOBBY) return;
    if (err.type === 'unavailable-id' && attempt < 5){ peer.destroy(); HOSTPEER = null; openTable(attempt + 1); return; }
    if (!LOBBY.code){
      peer.destroy(); HOSTPEER = null; LOBBY.codeState = 'err';
      LOBBY.codeErr = ['network','server-error','socket-error','socket-closed','browser-incompatible'].includes(err.type)
        ? "Impossible de joindre le service de mise en relation. Vérifiez qu'internet est disponible (Wi-Fi ou données), puis réessayez."
        : `Impossible de créer le code (${err.type}).`;
      sync(true);
    }
  });
  peer.on('disconnected', () => { if (HOSTPEER === peer && LOBBY && !G){ try { peer.reconnect(); } catch(e){} } });
}
function closeTable(){ if (HOSTPEER){ const p = HOSTPEER; HOSTPEER = null; setTimeout(() => { try { p.destroy(); } catch(e){} }, 500); } }
function onGuestConn(dc){
  const L = wrapConn(dc);
  let done = false;
  const t = setTimeout(() => { if (!done){ done = true; L.close(); } }, 20000);
  const refuse = reason => { L.send(JSON.stringify({t:'reject', reason})); setTimeout(() => L.close(), 500); };
  L.onmsg = s => {
    if (done) return;
    let m; try { m = JSON.parse(s); } catch(e){ return; }
    if (!m || m.t !== 'hello') return;
    done = true; clearTimeout(t);
    if (m.v !== VERSION) return refuse("Version différente de l'application : rechargez-la sur les deux téléphones.");
    if (!LOBBY || G || LOBBY.seats.length >= 5) return refuse('La partie est complète ou déjà lancée.');
    const seatObj = {name:uniqueName(cleanName(m.name) || 'Matelot'), kind:'remote', conn:L};
    LOBBY.seats.push(seatObj);
    wireGuest(seatObj, L);
    sync(true);
  };
  L.onclose = () => { done = true; clearTimeout(t); };
}
function uniqueName(n){ let name = n, i = 2; while (LOBBY.seats.some(s => s.name === name)) name = `${n} ${i++}`; return name; }
function wireGuest(seatObj, L){
  L.lastSeen = Date.now();
  L.onmsg = s => {
    let m; try { m = JSON.parse(s); } catch(err){ return; }
    if (!m || typeof m !== 'object') return;
    if (m.t === 'answer' && G){ const i = G.players.findIndex(p => p.seatRef === seatObj); if (i >= 0) handleAnswer(i, m); }
  };
  L.onclose = () => seatLost(seatObj, 'connexion perdue');
}
setInterval(() => {
  if (ROLE === 'host' && LOBBY){
    const now = Date.now();
    for (const s of [...LOBBY.seats]){
      if (s.kind === 'remote' && s.conn){
        s.conn.send('{"t":"hb"}');
        if (now - s.conn.lastSeen > 60000){ s.conn.close(); seatLost(s, 'plus de nouvelles depuis 1 minute'); }
      }
    }
  }
  if (ROLE === 'guest' && HOSTCONN && HOSTCONN.isOpen()){
    HOSTCONN.send('{"t":"hb"}');
    if (Date.now() - HOSTCONN.lastSeen > 60000) guestLost("Plus de nouvelles de l'hôte depuis 1 minute.");
  }
}, 3000);

/* ---------- Écran toujours allumé pendant la partie ---------- */
let wake = null;
async function keepAwake(){
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible' && !wake){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch(e){ wake = null; }
}
document.addEventListener('visibilitychange', () => { if (ROLE) keepAwake(); });

function closeOverlay(){ const o = $('#overlay'); o.hidden = true; o.innerHTML = ''; }

/* Invité : rejoindre avec le code de 4 lettres */
function guestJoin(raw){
  const code = String(raw || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (code.length !== 4 || [...code].some(ch => !CODE_ALPHA.includes(ch))){ UI = {screen:'join', err:'Le code fait 4 lettres (sans I ni O).', code}; render(); return; }
  ROLE = 'guest'; UI = {screen:'joining', code}; render();
  const peer = new Peer(undefined, {...SIGNAL(), debug:0});
  GUESTPEER = peer;
  let connected = false;
  const fail = msg => { if (GUESTPEER === peer && !connected) guestLost(msg, code); };
  const t = setTimeout(() => fail("Pas de réponse de l'hôte. Vérifiez le code et votre connexion internet."), 20000);
  peer.on('error', err => {
    if (connected) return;
    clearTimeout(t);
    fail(err.type === 'peer-unavailable' ? `Aucune partie ouverte avec le code ${code}. Vérifiez les lettres auprès de l'hôte.`
      : (['network','server-error','socket-error','socket-closed'].includes(err.type) ? 'Impossible de joindre le service de mise en relation : il faut internet (Wi-Fi ou données) pour rejoindre une partie.' : `Connexion impossible (${err.type}).`));
  });
  peer.on('open', () => {
    if (GUESTPEER !== peer) return;
    const dc = peer.connect(PEER_PREFIX + code, {reliable:true, serialization:'raw'});
    const L = wrapConn(dc); HOSTCONN = L;
    dc.on('open', () => { connected = true; clearTimeout(t); L.send(JSON.stringify({t:'hello', name:myName(), v:VERSION})); UI = {screen:'wait', code}; render(); keepAwake(); });
    L.onmsg = s => {
      let m; try { m = JSON.parse(s); } catch(err){ return; }
      if (!m || typeof m !== 'object') return;
      if (m.t === 'vm' && m.vm && typeof m.vm === 'object'){ VM = m.vm; MYSEAT = VM.me | 0; if (UI.screen !== 'rules') UI = {screen:'play'}; render(); }
      if (m.t === 'reject'){ connected = false; guestLost(String(m.reason || 'Connexion refusée.')); }
      if (m.t === 'bye'){ connected = false; guestLost("L'hôte a fermé la partie."); }
    };
    L.onclose = () => { if (connected){ connected = false; guestLost("La connexion avec l'hôte est coupée."); } else fail("Impossible de joindre l'hôte."); };
  });
}
function guestLost(msg, code){
  if (ROLE !== 'guest') return;
  const hc = HOSTCONN, gp = GUESTPEER;

}

  if (ROLE === 'host'){

    for (const s of (LOBBY ? LOBBY.seats : [])) if (s.conn){ const c = s.conn; c.send('{"t":"bye"}'); setTimeout(() => c.close(), 300); }
    closeTable(); G = null; LOBBY = null;

  if (ROLE === 'guest'){ const hc = HOSTCONN, gp = GUESTPEER; HOSTCONN = null; GUESTPEER = null; if (hc) hc.close(); if (gp) setTimeout(() => { try { gp.destroy(); } catch(e){} }, 300); }

  const t = e.target.closest('[data-act],[data-opt],[data-buy],[data-tab],[data-rm]');
  if (!t) return;
  if (t.dataset.opt !== undefined && VM && VM.prompt){ onLocalAnswer({id:VM.prompt.id, i:+t.dataset.opt}); return; }
  if (t.dataset.buy !== undefined && VM && VM.prompt && VM.prompt.market){ onLocalAnswer({id:VM.prompt.id, buy:+t.dataset.buy}); return; }
  if (t.dataset.tab){ TAB = t.dataset.tab; render(); window.scrollTo({top:0}); return; }
  if (t.dataset.rm !== undefined && ROLE === 'host' && !G){
    const s = LOBBY.seats[+t.dataset.rm];
    if (s && s.kind !== 'local'){ LOBBY.seats.splice(+t.dataset.rm, 1); if (s.conn){ const c = s.conn; c.onclose = null; c.send(JSON.stringify({t:'reject', reason:"L'hôte vous a retiré de la partie."})); setTimeout(() => c.close(), 300); } sync(true); }
    return;
  }
  const a = t.dataset.act;
  if (a === 'host') { const v = $('#nameIn'); if (v) store.set('mers.name', cleanName(v.value)); goHost(false); }
  else if (a === 'solo') { const v = $('#nameIn'); if (v) store.set('mers.name', cleanName(v.value)); goHost(true); }
  else if (a === 'join') { const v = $('#nameIn'); if (v) store.set('mers.name', cleanName(v.value)); UI = {screen:'join'}; render(); }
  else if (a === 'joingo') { const v = $('#codeIn'); guestJoin(v ? v.value : ''); }
  else if (a === 'opencode') openTable();
  else if (a === 'rules') { closeOverlay(); UI = {...UI, prev:UI.screen, screen:'rules'}; render(); }
  else if (a === 'back') { UI = {screen:UI.prev || 'play'}; render(); }
  else if (a === 'home') { quitAll(); }
  else if (a === 'addbot') { if (LOBBY.seats.length < 5){ addBot(); sync(true); } }
  else if (a === 'start') { if (LOBBY.seats.length >= 2) startGame(); }
  else if (a === 'again') { gid++; pending = null; G = null; LOBBY.seats = LOBBY.seats.filter(s => s.kind !== 'remote' || (s.conn && s.conn.isOpen())); sync(true); }
  else if (a === 'menu') openMenu();
  else if (a === 'close') closeOverlay();
  else if (a === 'askquit') { const o = $('#overlay'); o.innerHTML = `<div class="paper modal stack"><h3>${ROLE === 'host' ? 'Arrêter la partie pour tout le monde ?' : 'Quitter la partie ?'}</h3><p class="note">${ROLE === 'host' ? 'Les autres téléphones seront déconnectés.' : 'Un bot prendra votre place.'}</p><div class="row" style="justify-content:center"><button class="btn" type="button" data-act="close">Non</button><button class="btn go" type="button" data-act="quit">Oui</button></div></div>`; }
  else if (a === 'quit') quitAll();
});
document.addEventListener('input', e => {
  if (e.target.id === 'codeIn'){ const v = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4); if (v !== e.target.value) e.target.value = v; }
});
document.addEventListener('change', e => {
  if (e.target.name === 'goal' && LOBBY && !G){ LOBBY.goal = +e.target.value; sync(true); }
  if (e.target.name === 'spd'){ SPEED = +e.target.value; store.set('mers.speed', String(SPEED)); }
});
render();

/* Hors ligne : met l'application en cache après la première visite */
if ('serviceWorker' in navigator && location.protocol === 'https:'){ window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
</script>
